<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model selector — design explorations</title>
<style>
:root{color-scheme:dark;--bg:#141417;--panel:#222126;--raised:#2b2a30;--line:#414047;--text:#efedf2;--muted:#aaa6b1;--blue:#b1e3f4;--teal:#364f50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.page{max-width:1510px;margin:auto;padding:56px 36px 80px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#8f9299;font-weight:700}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:10px 0 38px}.intro h1{font-size:27px;letter-spacing:-.04em;margin:0 0 7px}.intro p{margin:0;color:var(--muted);max-width:550px}.hint{color:#777780;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 26px;align-items:start}.caption{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}.caption span{color:#78b4c4;font-size:11px;font-weight:700;letter-spacing:.08em}.caption h2{font-size:13px;margin:0;font-weight:600}.caption p{margin:0 0 0 auto;color:#81808a;font-size:11px}.modal{background:var(--panel);border:1px solid #4a4851;border-radius:15px;box-shadow:0 18px 45px #0005;overflow:hidden;min-height:446px}.head{padding:19px 18px 14px}.head-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:650;font-size:14px;letter-spacing:-.01em}.sub{color:var(--muted);font-size:12px;margin-top:3px}.icon-btn{border:0;background:none;color:#a7a4ad;padding:4px;cursor:pointer}.search{display:flex;align-items:center;gap:9px;background:#18181b;border:1px solid #4b4a50;border-radius:8px;padding:0 11px;height:38px;margin-top:14px;color:#8d8c95}.search:focus-within{border-color:#98d2e1}.search input{border:0;outline:0;background:none;color:var(--text);width:100%;min-width:0}.search input::placeholder{color:#77767e}.search svg,.ico svg{width:15px;height:15px;display:block;flex:none}.kbd{font-size:10px;color:#929099;border:1px solid #4a494f;border-radius:4px;padding:1px 4px;white-space:nowrap}.content{padding:0 10px 12px}.section{display:flex;align-items:center;justify-content:space-between;color:#aaa5b0;font-weight:650;font-size:11px;letter-spacing:.025em;padding:13px 8px 6px}.section small{font-size:10px;color:#777680;font-weight:500}.row{width:100%;min-height:39px;border:0;border-radius:7px;background:transparent;display:flex;align-items:center;gap:9px;text-align:left;padding:7px 8px;cursor:pointer}.row:hover{background:#323137}.row.selected{background:#32383a}.name{flex:1;min-width:0;font-size:13px}.badge{font-size:10px;letter-spacing:.02em;background:var(--teal);color:#c5e5e5;border-radius:5px;padding:3px 7px;white-space:nowrap}.check{color:var(--blue);font-size:14px;width:15px;text-align:center}.star{color:var(--blue);font-size:17px;line-height:1;padding:3px;border:0;background:none;cursor:pointer}.star:not(.active){color:#a2c5d3}.divider{height:1px;background:#3a393f;margin:7px 8px}.empty{color:var(--muted);padding:20px 8px;font-size:12px}.footer{border-top:1px solid #3a393f;padding:11px 18px;color:#88858f;font-size:11px;display:flex;align-items:center;justify-content:space-between}.footer b{color:#b0adb5;font-weight:500}.tabs{display:flex;gap:4px;padding:0 18px 7px}.tab{background:none;border:0;border-radius:6px;color:#99969f;font-size:12px;padding:6px 10px;cursor:pointer}.tab.active{background:#39383e;color:#f0eef1}.tab-count{font-size:10px;color:#a8a6ae;margin-left:4px}.compact .head{padding-bottom:9px}.compact .content{padding-top:2px}.compact .row{min-height:38px}.current{margin:0 18px 4px;border:1px solid #46595b;background:#293536;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:10px}.current .name{font-weight:600}.current-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#9db8b8;margin-bottom:3px}.current .check{margin-left:auto}.split{display:grid;grid-template-columns:120px 1fr;min-height:346px;border-top:1px solid #3a393f}.rail{padding:12px 8px;border-right:1px solid #3a393f}.rail button{display:block;width:100%;text-align:left;border:0;background:none;color:#a8a5ae;padding:8px;border-radius:6px;font-size:12px;cursor:pointer}.rail button.active{color:#eef1f1;background:#393a3d}.rail button span{float:right;color:#85838c}.split .content{padding:8px}.split .row{min-height:46px}.split .name small,.detailed .name small{display:block;color:#96939d;font-size:11px;margin-top:2px}.provider-dot{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#364b4b;color:#c0e0df;font-size:11px;font-weight:700;flex:none}.detailed .row{padding:9px 8px;min-height:56px}.detailed .section{padding-top:10px}.detailed .modal{min-height:446px}.top-accent{height:3px;background:linear-gradient(90deg,#78b9c9,#719792 58%,transparent)}.pills{display:flex;gap:6px;margin-top:12px}.pill{border:1px solid #47464d;border-radius:20px;padding:5px 10px;background:none;color:#a9a6ae;font-size:11px;cursor:pointer}.pill.active{background:#394b4c;border-color:#516b6c;color:#d5eeee}.provider-heading{display:flex;align-items:center;gap:8px;padding:13px 8px 6px;color:#d5d3d9;font-weight:600;font-size:12px}.provider-heading .provider-dot{width:21px;height:21px;border-radius:6px;font-size:9px}.provider-heading small{font-size:10px;font-weight:400;color:#8e8b95;margin-left:auto}.grouped .row{padding-left:37px}.grouped .section{padding-top:8px}.grouped .footer{margin-top:5px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.page{padding:32px 18px 55px}.grid{grid-template-columns:1fr}.intro{align-items:start;flex-direction:column}.hint{white-space:normal}.caption p{display:none}}
</style>
</head>
<body>
<main class="page">
  <div class="eyebrow">Synthesis · interface exploration</div>
  <div class="intro"><div><h1>A better place to pick a model.</h1><p>Five directions for the same familiar selector. Each explores a different balance of hierarchy, navigation and context.</p></div><div class="hint">Interactive concepts · search, select and favourite</div></div>
  <div class="grid" id="gallery"></div>
</main>
<script>
const models=[{id:'luna',name:'GPT-6 Luna',provider:'OpenAI',detail:'Thoughtful, everyday intelligence',favorite:true},{id:'sol',name:'GPT-6.1 Sol',provider:'OpenAI',detail:'Fast and versatile',favorite:true},{id:'terra',name:'GPT-6.1 Terra',provider:'OpenAI',detail:'Powerful reasoning',favorite:true},{id:'chat',name:'Chat Latest',provider:'OpenAI',detail:'The latest chat model',favorite:false},{id:'gpt4',name:'GPT-4',provider:'OpenAI',detail:'Reliable and capable',favorite:false},{id:'turbo',name:'GPT-4 Turbo',provider:'OpenAI',detail:'Speed for everyday tasks',favorite:false},{id:'gpt41',name:'GPT-4.1',provider:'OpenAI',detail:'Strong coding and instruction following',favorite:false}];
const configs=[['01','Refined familiar','A quieter evolution'],['02','Focused tabs','One list at a time'],['03','Current first','Selection at a glance'],['04','Sidebar navigator','A little more structure'],['05','Provider groups','Identity-led browsing']];
const states=configs.map(()=>({selected:'terra',favorites:new Set(models.filter(m=>m.favorite).map(m=>m.id)),query:'',filter:'all'}));
const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>';
function search(i){return `<label class="search">${searchIcon}<input aria-label="Search models or providers" data-search="${i}" placeholder="Search models or providers" value="${states[i].query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"><span class="kbd">⌘ K</span></label>`}
function row(m,i,detail=false,dot=false){let s=states[i],sel=s.selected===m.id;return `<div class="row ${sel?'selected':''}" role="button" tabindex="0" data-select="${m.id}" aria-label="Select ${m.name}" aria-pressed="${sel}">${dot?'<span class="provider-dot">O</span>':''}<span class="name">${m.name}${detail?`<small>${m.detail}</small>`:''}</span>${!detail?`<span class="badge">${m.provider}</span>`:''}<span class="check">${sel?'✓':''}</span><button class="star ${s.favorites.has(m.id)?'active':''}" data-star="${m.id}" aria-label="${s.favorites.has(m.id)?'Remove '+m.name+' from favourites':'Add '+m.name+' to favourites'}" aria-pressed="${s.favorites.has(m.id)}">${s.favorites.has(m.id)?'★':'☆'}</button></div>`}
function group(title,items,i,detail=false,dot=false){if(!items.length)return '';return `<div class="section">${title}<small>${items.length}</small></div>${items.map(m=>row(m,i,detail,dot)).join('')}`}
function render(i){const s=states[i],q=s.query.trim().toLowerCase(),filtered=models.filter(m=>(m.name+' '+m.provider).toLowerCase().includes(q)),favs=filtered.filter(m=>s.favorites.has(m.id)),others=filtered.filter(m=>!s.favorites.has(m.id)),chosen=models.find(m=>m.id===s.selected),empty='<div class="empty">No models found. Try another search.</div>';let html='';
if(i===0){html=`<div class="head"><div class="head-line"><span class="title">Choose a model</span><span class="ico" style="color:#918e99">✳</span></div>${search(i)}</div><div class="content">${filtered.length?group('Favourites',favs,i)+group('All models',others,i):empty}</div>`}
if(i===1){let list=s.filter==='favorites'?favs:filtered;html=`<div class="head"><div class="title">Choose a model</div><div class="sub">Find the right model for this conversation.</div>${search(i)}</div><div class="tabs"><button class="tab ${s.filter==='all'?'active':''}" data-filter="all">All models <span class="tab-count">${models.length}</span></button><button class="tab ${s.filter==='favorites'?'active':''}" data-filter="favorites">Favourites <span class="tab-count">${s.favorites.size}</span></button></div><div class="content">${list.length?list.map(m=>row(m,i)).join(''):'<div class="empty">No models to show.</div>'}</div>`}
if(i===2){html=`<div class="top-accent"></div><div class="head"><div class="head-line"><span class="title">Models</span><span style="color:#8f8c95;font-size:11px">SELECTED MODEL</span></div></div><div class="current"><div class="provider-dot">O</div><div><div class="current-label">Currently using</div><div class="name">${chosen.name}</div></div><span class="check">✓</span></div><div class="head" style="padding-top:0;padding-bottom:3px">${search(i)}</div><div class="content">${filtered.length?group('Favourites',favs,i)+group('Explore models',others,i):empty}</div><div class="footer"><span>Your choice applies to this conversation</span><b>✦</b></div>`}
if(i===3){let list=s.filter==='favorites'?favs:filtered;html=`<div class="head"><div class="title">Choose a model</div>${search(i)}</div><div class="split"><nav class="rail" aria-label="Model filters"><button class="${s.filter==='all'?'active':''}" data-filter="all">All models <span>${models.length}</span></button><button class="${s.filter==='favorites'?'active':''}" data-filter="favorites">Favourites <span>${s.favorites.size}</span></button><div class="divider"></div><div class="section" style="padding:8px">PROVIDERS</div><button class="${s.filter==='provider'?'active':''}" data-filter="provider">OpenAI <span>${models.length}</span></button></nav><div class="content"><div class="section">${s.filter==='favorites'?'Favourites':s.filter==='provider'?'OpenAI':'All models'} <small>${list.length} models</small></div>${list.length?list.map(m=>row(m,i,true,false)).join(''):'<div class="empty">No models to show.</div>'}</div></div>`}
if(i===4){let list=s.filter==='favorites'?favs:filtered;html=`<div class="head"><div class="head-line"><div><div class="title">Choose a model</div><div class="sub">Browse by provider or find a favourite.</div></div><span style="color:#99969f;font-size:19px">⌄</span></div>${search(i)}<div class="pills"><button class="pill ${s.filter==='all'?'active':''}" data-filter="all">All models</button><button class="pill ${s.filter==='favorites'?'active':''}" data-filter="favorites">★ &nbsp;Favourites</button></div></div><div class="content grouped">${list.length?`<div class="provider-heading"><span class="provider-dot">O</span> OpenAI <small>${list.length} models</small></div>${list.map(m=>row(m,i)).join('')}`:empty}</div><div class="footer"><span>Selected</span><b>${chosen.name} &nbsp; ✓</b></div>`}
const panel=document.querySelector(`[data-panel="${i}"]`);panel.innerHTML=html;
}
const gallery=document.getElementById('gallery');gallery.innerHTML=configs.map(([n,title,desc],i)=>`<section class="${i===0?'compact':i===3?'detailed':''}"><div class="caption"><span>${n}</span><h2>${title}</h2><p>${desc}</p></div><div class="modal" data-panel="${i}"></div></section>`).join('');states.forEach((_,i)=>render(i));
gallery.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;const i=Number(e.target.dataset.search),pos=e.target.selectionStart;states[i].query=e.target.value;render(i);const input=gallery.querySelector(`[data-search="${i}"]`);input.focus();input.setSelectionRange(pos,pos)});
gallery.addEventListener('click',e=>{const panel=e.target.closest('[data-panel]');if(!panel)return;const i=Number(panel.dataset.panel),star=e.target.closest('[data-star]'),filter=e.target.closest('[data-filter]'),select=e.target.closest('[data-select]');if(star){const id=star.dataset.star;states[i].favorites.has(id)?states[i].favorites.delete(id):states[i].favorites.add(id)}else if(filter)states[i].filter=filter.dataset.filter;else if(select)states[i].selected=select.dataset.select;else return;render(i)});
gallery.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-select]')){e.preventDefault();e.target.click()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();(document.activeElement.closest('[data-panel]')?.querySelector('input')||document.querySelector('input')).focus()}});
</script>
</body>
</html>
