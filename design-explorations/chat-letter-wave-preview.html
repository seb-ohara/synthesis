<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter wave chat preview</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #181818; color: #e7e7e7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
  .page { width: min(900px, 100%); }
  .intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 0 0 18px; }
  h1 { margin: 0 0 5px; font-size: 21px; letter-spacing: -.02em; font-weight: 600; }
  .intro p { margin: 0; color: #999; font-size: 13px; line-height: 1.5; }
  .reset { border: 1px solid #494949; border-radius: 7px; color: #c9c9c9; background: #262626; padding: 8px 11px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .reset:hover { background: #353535; color: #fff; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid #ddd; outline-offset: 3px; }
  .window { height: min(720px, calc(100vh - 145px)); min-height: 480px; background: #202020; border: 1px solid #3c3c3c; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 60px #0003; }
  .bar { flex: none; height: 43px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid #353535; color: #bbb; font-size: 12px; }
  .bar span { color: #747474; margin-left: auto; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .thread { width: min(700px, calc(100% - 40px)); margin: auto; padding: 42px 0 20px; font-size: 13px; line-height: 1.65; }
  .message { margin-bottom: 30px; }
  .user { margin-left: auto; width: fit-content; max-width: min(85%, 560px); padding: 10px 15px; border-radius: 15px 15px 5px 15px; background: #343434; color: #e4e4e4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .assistant { max-width: 90%; color: #d6d6d6; }
  .timer { color: #8f8f8f; margin: -8px 0 12px; }
  .status { margin: 12px 0; color: #909090; }
  .wave span { animation: letter 1.8s ease-in-out infinite; }
  .wave span:nth-child(2) { animation-delay: .09s; } .wave span:nth-child(3) { animation-delay: .18s; } .wave span:nth-child(4) { animation-delay: .27s; } .wave span:nth-child(5) { animation-delay: .36s; } .wave span:nth-child(6) { animation-delay: .45s; } .wave span:nth-child(7) { animation-delay: .54s; } .wave span:nth-child(8) { animation-delay: .63s; } .wave span:nth-child(9) { animation-delay: .72s; }
  @keyframes letter { 0%, 55%, 100% { color: #909090; } 25% { color: #fff; } }
  .composer { flex: none; width: min(700px, calc(100% - 40px)); margin: 0 auto 24px; border: 1px solid #464646; border-radius: 18px; padding: 12px 12px 9px; background: #272727; }
  textarea { display: block; width: 100%; resize: none; min-height: 44px; padding: 1px 4px; border: 0; outline: 0; background: transparent; color: #eee; font: inherit; font-size: 13px; line-height: 20px; }
  textarea::placeholder { color: #858585; }
  .controls { display: flex; align-items: center; gap: 14px; color: #999; font-size: 12px; padding: 1px 3px; }
  .controls .spacer { flex: 1; }
  .icon { font-size: 18px; line-height: 1; color: #aaa; }
  .send { border: 0; border-radius: 7px; padding: 7px 10px; color: #202020; background: #ccc; font: inherit; font-weight: 600; cursor: pointer; }
  .send:hover { background: #fff; }
  .note { color: #858585; font-size: 12px; line-height: 1.5; margin: 12px 0 0; }
  @media (max-width: 600px) { body { padding: 16px; } .intro { align-items: start; } .window { min-height: 420px; height: calc(100dvh - 165px); } .thread { padding-top: 28px; } }
  @media (prefers-reduced-motion: reduce) { .wave span { animation: none; color: #bdbdbd; } }
</style>
</head>
<body>
<main class="page">
  <div class="intro"><div><h1>Letter wave in chat</h1><p>A live preview of the working state.</p></div><button class="reset" type="button" id="restart">Restart preview</button></div>
  <section class="window" aria-label="Simulated chat">
    <div class="bar">Chat <span>Preview</span></div>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <form class="composer" id="composer"><textarea id="input" rows="2" placeholder="Ask anything…" aria-label="Message"></textarea><div class="controls"><span class="icon" aria-hidden="true">＋</span><span aria-hidden="true">Aa</span><span class="spacer"></span><span aria-hidden="true">Model ⌄</span><span aria-hidden="true">Off ⌄</span><button class="send" type="submit">Send</button></div></form>
  </section>
  <p class="note">The timer runs continuously. Send a message or restart the preview to begin again.</p>
</main>
<script>
  const thread = document.querySelector('#thread');
  const scroll = document.querySelector('#scroll');
  const input = document.querySelector('#input');
  let timer;
  function formatElapsed(ms) {
    const seconds = Math.floor(ms / 1000), h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
    return h ? `${h}h ${m}m ${s}s` : m ? `${m}m ${s}s` : `${s}s`;
  }
  function start(prompt) {
    clearInterval(timer);
    thread.replaceChildren();
    const message = document.createElement('div');
    message.className = 'message user';
    message.textContent = prompt;
    const elapsed = document.createElement('div');
    elapsed.className = 'timer';
    elapsed.textContent = 'Working for 0s';
    const status = document.createElement('div');
    status.className = 'status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-label', 'Thinking');
    const wave = document.createElement('span');
    wave.className = 'wave';
    wave.setAttribute('aria-hidden', 'true');
    for (const char of 'Thinking…') { const letter = document.createElement('span'); letter.textContent = char; wave.append(letter); }
    status.append(wave);
    thread.append(message, elapsed, status);
    const started = Date.now();
    timer = setInterval(() => { elapsed.textContent = `Working for ${formatElapsed(Date.now() - started)}`; }, 1000);
    scroll.scrollTop = scroll.scrollHeight;
  }
  document.querySelector('#restart').addEventListener('click', () => { input.value = ''; start('Help me think through an idea.'); });
  document.querySelector('#composer').addEventListener('submit', event => { event.preventDefault(); const prompt = input.value.trim(); if (!prompt) return; input.value = ''; start(prompt); });
  input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); document.querySelector('#composer').requestSubmit(); } });
  start('Help me think through an idea.');
</script>
</body>
</html>
