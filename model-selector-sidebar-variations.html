<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sidebar navigator — variations</title>
<style>
:root{color-scheme:dark;--panel:#222126;--border:#494750;--muted:#96939e;--text:#f0eef2;--accent:#afe0ef}*{box-sizing:border-box}body{margin:0;background:#141417;color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.page{max-width:1450px;margin:auto;padding:54px 36px 80px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#86b8c6;font-weight:700;font-size:11px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 38px}h1{font-size:27px;letter-spacing:-.04em;margin:0 0 7px}.intro p{margin:0;color:#aaa6b1}.hint{font-size:12px;color:#85828d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 30px;align-items:start}.caption{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.caption .num{color:#86bdcc;font-weight:700;font-size:11px;letter-spacing:.08em}.caption h2{font-size:13px;margin:0}.caption p{margin:0 0 0 auto;color:#8b8892;font-size:11px}.modal{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden;box-shadow:0 18px 45px #0005}.header{padding:18px 18px 15px}.header-top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:650;font-size:14px}.header-note{color:#8f8c96;font-size:11px}.search{display:flex;align-items:center;gap:9px;height:38px;background:#19191c;border:1px solid #48474e;border-radius:8px;padding:0 11px;margin-top:14px;color:#918e98}.search:focus-within{border-color:#98d2e1}.search svg{width:15px;height:15px;flex:none}.search input{border:0;outline:0;background:none;color:var(--text);width:100%;min-width:0}.search input::placeholder{color:#797780}.key{color:#8e8b95;border:1px solid #49474e;border-radius:4px;font-size:10px;padding:1px 4px;white-space:nowrap}.layout{display:grid;grid-template-columns:139px minmax(0,1fr);border-top:1px solid #39383f;min-height:390px}.nav{border-right:1px solid #39383f;padding:12px 8px}.nav-label{font-size:10px;letter-spacing:.07em;font-weight:650;color:#85818d;padding:14px 9px 6px;text-transform:uppercase}.nav-button{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:7px;text-align:left;padding:9px;color:#a9a6af;font-size:12px}.nav-button:hover{background:#302f35}.nav-button.active{color:#f3f1f3;background:#393a3e}.nav-icon{color:#a9cfd9;font-size:14px;width:15px;text-align:center}.count{color:#89868f;font-size:10px;margin-left:auto}.nav-divider{height:1px;background:#3a393f;margin:11px 8px 0}.list{padding:12px 10px}.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 8px 8px}.list-title{font-size:11px;font-weight:650;letter-spacing:.03em;color:#b2aeb8}.list-count{color:#817e88;font-size:10px}.row{display:flex;align-items:center;gap:10px;width:100%;border-radius:8px;padding:9px 8px;min-height:53px;cursor:pointer}.row:hover{background:#302f35}.row.selected{background:#333b3c}.model{min-width:0;flex:1}.model-name{font-size:13px;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{font-size:11px;color:#96939d;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{color:var(--accent);width:14px;text-align:center;flex:none}.fav{border:0;background:transparent;padding:4px;color:#a5c9d4;font-size:17px;line-height:1;flex:none}.fav.on{color:#b5e8f6}.fav:hover{color:#e3f8ff}.empty{padding:24px 8px;color:#9c99a3;font-size:12px}.footer{border-top:1px solid #3a393f;padding:10px 18px;color:#918e98;font-size:11px;display:flex;justify-content:space-between;gap:8px}.footer strong{font-weight:550;color:#c7c4cc}.provider-icon{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:#364e4d;color:#c6e8e5;font-size:11px;font-weight:700;flex:none}.tag{background:#374d4d;color:#c5e1e0;border-radius:5px;padding:3px 7px;font-size:10px;white-space:nowrap}.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#87848f;font-weight:700;padding:8px 8px 5px}.section-line{height:1px;background:#3a393f;margin:8px}.variant-1 .modal{max-width:410px}.variant-1 .model-name{font-weight:400}.variant-1 .model-name span{display:inline-block;white-space:nowrap}.variant-1 .row:hover .model-name.overflowing span,.variant-1 .row:focus-within .model-name.overflowing span{animation:model-scroll 4s ease-in-out 0.6s infinite alternate}@keyframes model-scroll{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--scroll-distance))}}@media (prefers-reduced-motion:reduce){.variant-1 .row:hover .model-name.overflowing span,.variant-1 .row:focus-within .model-name.overflowing span{animation:none}}.variant-1 .header{padding:14px 14px 11px}.variant-1 .search{margin-top:10px;height:34px}.variant-1 .layout{grid-template-columns:125px minmax(0,1fr);min-height:0}.variant-1 .nav{padding:8px 7px}.variant-1 .nav-button{padding:7px}.variant-1 .nav-label{padding-top:10px}.variant-1 .list{padding:9px 8px 10px}.variant-1 .list-head{padding-bottom:5px}.variant-1 .row{border-radius:5px;min-height:35px;padding:5px 8px}.variant-1 .row.selected{background:#39383e}.variant-1 .footer{padding:8px 14px}.variant-1 .fav{font-size:14px}.variant-1 .row .fav:not(.on){opacity:0}.variant-1 .row:hover .fav,.variant-1 .row:focus-within .fav{opacity:1}@media (hover:none){.variant-1 .row .fav:not(.on){opacity:1}}.variant-2 .layout{grid-template-columns:145px minmax(0,1fr)}.variant-2 .header{padding-bottom:16px}.variant-2 .fav{font-size:12px;border:1px solid #4b4a51;border-radius:6px;color:#aaa7b0;padding:5px 7px}.variant-2 .fav.on{background:#384e4e;border-color:#516d6c;color:#cfebeb}.variant-2 .fav:hover{border-color:#95cbd5}.variant-2 .row{min-height:58px}.variant-3 .nav{background:#1d1d21}.variant-3 .fav{font-size:12px;color:#aaa6af;border:1px solid #47454e;border-radius:6px;padding:5px 7px}.variant-3 .fav.on{color:#c8e7ed;background:#354647;border-color:#526668}.variant-3 .selected{background:#30383a}.variant-4 .layout{grid-template-columns:150px minmax(0,1fr)}.variant-4 .fav{border-radius:6px;background:#34343a;color:#aaa8b0;font-size:15px;width:27px;height:27px}.variant-4 .fav.on{color:#191e20;background:#a8d9e2}.variant-4 .nav-shortcuts{padding:0 4px}.shortcut{border:0;background:transparent;color:#aaa6af;width:100%;text-align:left;border-radius:6px;padding:6px 5px;font-size:11px;display:flex;align-items:center;gap:6px}.shortcut:hover{background:#333238;color:#f1f0f3}.shortcut span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mini-dot{color:#a6d5e1;font-size:10px}.variant-4 .nav-empty{color:#77757e;font-size:10px;padding:5px;line-height:1.4}@media(max-width:1000px){.grid{grid-template-columns:1fr}.page{max-width:700px}}@media(max-width:520px){.page{padding:32px 14px}.intro{display:block}.hint{margin-top:14px}.caption p{display:none}.layout,.variant-2 .layout,.variant-4 .layout{grid-template-columns:112px minmax(0,1fr)}.nav-button{padding:8px 5px;gap:4px}.tag{display:none}.row{gap:6px}.fav{font-size:15px}}
</style>
</head>
<body><main class="page"><div class="eyebrow">Synthesis · model selector</div><div class="intro"><div><h1>Sidebar navigator, explored.</h1><p>A compact sidebar navigator with hover-to-favourite controls.</p></div><div class="hint">Interactive concepts · search, filter, select and favourite</div></div><div class="grid" id="gallery"></div></main>
<script>
const models=[{id:'luna',name:'GPT-6 Luna',detail:'Thoughtful, everyday intelligence'},{id:'sol',name:'GPT-6.1 Sol',detail:'Fast and versatile'},{id:'terra',name:'GPT-6.1 Terra',detail:'Powerful reasoning'},{id:'chat',name:'Chat Latest',detail:'The latest chat model'},{id:'gpt4',name:'GPT-4',detail:'Reliable and capable'},{id:'turbo',name:'GPT-4 Turbo',detail:'Speed for everyday tasks'},{id:'gpt41',name:'GPT-4.1',detail:'Coding and instruction following'}];
const concepts=[['01','The hover-to-favourite star','Appears on hover; stays when favourited']];
const states=concepts.map(()=>({selected:'terra',favorites:new Set(['luna','sol','terra']),filter:'all',query:''}));
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>';
const escape=s=>s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
function nav(i){const s=states[i];return `<nav class="nav" aria-label="Model navigation"><button class="nav-button ${s.filter==='all'?'active':''}" data-filter="all"><span class="nav-icon">◫</span>All models <span class="count">${models.length}</span></button><button class="nav-button ${s.filter==='favorites'?'active':''}" data-filter="favorites"><span class="nav-icon">${i===2?'⌑':'☆'}</span>${i===2?'Pinned':'Favourites'} <span class="count">${s.favorites.size}</span></button>${i===3?`<div class="nav-label">Your favourites</div><div class="nav-shortcuts">${models.filter(m=>s.favorites.has(m.id)).map(m=>`<button class="shortcut" data-select="${m.id}"><b class="mini-dot">${s.selected===m.id?'●':'○'}</b><span>${m.name}</span></button>`).join('')||'<div class="nav-empty">Star a model to add it here.</div>'}</div>`:''}<div class="nav-divider"></div><div class="nav-label">Providers</div><button class="nav-button ${s.filter==='provider'?'active':''}" data-filter="provider"><span class="nav-icon">◉</span>OpenAI <span class="count">${models.length}</span></button></nav>`}
function row(m,i){let s=states[i],fav=s.favorites.has(m.id),sel=s.selected===m.id;let favLabel=i===2?(fav?'Pinned':'Pin'):i===1?(fav?'★ Saved':'☆ Save'):(fav?'★':'☆');return `<div class="row ${sel?'selected':''}" role="button" tabindex="0" data-select="${m.id}" aria-label="Select ${m.name}" aria-pressed="${sel}">${i===1?'<span class="provider-icon">O</span>':''}<div class="model"><div class="model-name"><span>${m.name}</span></div>${i===0?'':`<div class="detail">${m.detail}</div>`}</div>${i===3?'<span class="tag">OpenAI</span>':''}${i===0?'':`<span class="check">${sel?'✓':''}</span>`}<button class="fav ${fav?'on':''}" data-fav="${m.id}" aria-label="${fav?'Remove '+m.name+' from favourites':'Add '+m.name+' to favourites'}" aria-pressed="${fav}">${favLabel}</button></div>`}
function render(i){const s=states[i],query=s.query.trim().toLowerCase(),results=models.filter(m=>(m.name+' OpenAI').toLowerCase().includes(query)),visible=s.filter==='favorites'?results.filter(m=>s.favorites.has(m.id)):results;let title=s.filter==='favorites'?(i===2?'Pinned models':'Favourites'):s.filter==='provider'?'OpenAI':'All models',body='';if(!visible.length){body=`<div class="empty">${query?'No models found. Try another search.':s.filter==='favorites'?'No favourites yet. Add a model to see it here.':'No models to show.'}</div>`}else if(i===2&&s.filter==='all'){let pinned=visible.filter(m=>s.favorites.has(m.id)),rest=visible.filter(m=>!s.favorites.has(m.id));body=(pinned.length?`<div class="section-title">Pinned</div>${pinned.map(m=>row(m,i)).join('')}`:'')+(pinned.length&&rest.length?'<div class="section-line"></div>':'')+(rest.length?`<div class="section-title">All other models</div>${rest.map(m=>row(m,i)).join('')}`:'')}else body=visible.map(m=>row(m,i)).join('');const selected=models.find(m=>m.id===s.selected);document.querySelector(`[data-panel="${i}"]`).innerHTML=`<div class="header"><div class="header-top"><span class="title">Choose a model</span><span class="header-note">${i===1?'Your conversation':i===3?'Model library':''}</span></div><label class="search">${icon}<input data-search="${i}" aria-label="Search models or providers" placeholder="Search models or providers" value="${escape(s.query)}"><span class="key">⌘ K</span></label></div><div class="layout">${nav(i)}<div class="list"><div class="list-head"><span class="list-title">${title}</span><span class="list-count">${visible.length} ${visible.length===1?'model':'models'}</span></div>${body}</div></div>${i===0?'':`<div class="footer"><span>${i===2?'Pin models to keep them at the top':i===3?'Star models for quick access':'Save models you use often'}</span><strong>${selected.name} &nbsp;✓</strong></div>`}`;if(i===0)requestAnimationFrame(()=>{document.querySelectorAll('.variant-1 .model-name').forEach(el=>{const text=el.firstElementChild,overflow=text.scrollWidth-el.clientWidth;el.classList.toggle('overflowing',overflow>0);el.style.setProperty('--scroll-distance',`${-Math.max(0,overflow)}px`)})})}
const gallery=document.querySelector('#gallery');gallery.innerHTML=concepts.map(([n,title,desc],i)=>`<section class="variant-${i+1}"><div class="caption"><span class="num">${n}</span><h2>${title}</h2><p>${desc}</p></div><div class="modal" data-panel="${i}"></div></section>`).join('');states.forEach((_,i)=>render(i));
gallery.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;const i=+e.target.dataset.search,pos=e.target.selectionStart;states[i].query=e.target.value;render(i);const input=gallery.querySelector(`[data-search="${i}"]`);input.focus();input.setSelectionRange(pos,pos)});
gallery.addEventListener('click',e=>{const panel=e.target.closest('[data-panel]');if(!panel)return;let i=+panel.dataset.panel,fav=e.target.closest('[data-fav]'),filter=e.target.closest('[data-filter]'),select=e.target.closest('[data-select]');if(fav){let id=fav.dataset.fav;states[i].favorites.has(id)?states[i].favorites.delete(id):states[i].favorites.add(id)}else if(filter)states[i].filter=filter.dataset.filter;else if(select)states[i].selected=select.dataset.select;else return;render(i)});
gallery.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-select]')){e.preventDefault();e.target.click()}});
window.addEventListener('resize',()=>{document.querySelectorAll('.variant-1 .model-name').forEach(el=>{const overflow=el.firstElementChild.scrollWidth-el.clientWidth;el.classList.toggle('overflowing',overflow>0);el.style.setProperty('--scroll-distance',`${-Math.max(0,overflow)}px`)})});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();(document.activeElement.closest('[data-panel]')?.querySelector('input')||document.querySelector('input')).focus()}});
</script></body></html>
